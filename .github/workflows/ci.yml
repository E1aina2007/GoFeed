name: CI - Code Review

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Code Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: feedsystem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: feedsystem_test
        run: go test -race -count=1 ./...

  compose:
    name: Compose Configuration and Health Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare example runtime configuration
        run: |
          cp backend/.env.example backend/.env
          cp backend/configs/config.example.yaml backend/configs/config.yaml

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify readiness health contract
        run: |
          docker compose config --format json |
            jq -e '(.services.backend.healthcheck.test | join(" ") | contains("/ready")) and (.services.frontend.depends_on.backend.condition == "service_healthy")'

  frontend:
    name: Frontend Code Review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit -- --run

      - name: Build
        run: pnpm run build
