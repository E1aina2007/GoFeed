services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      TZ: "Asia/Shanghai"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 版本化迁移：由 golang-migrate 执行 backend/db/migrations 下的迁移文件
  # 依赖数据库已手动创建；迁移服务跑完退出后，backend/worker/sweeper 才会启动
  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=mysql://root:${MYSQL_ROOT_PASSWORD:-changeme}@tcp(mysql:3306)/${MYSQL_DATABASE:-feedsystem}?multiStatements=true
      - up

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: always
    environment:
      # 容器实际读取宿主机挂载的 configs/config.yaml（见 volumes）；
      # 以下环境变量可覆盖 config.yaml 对应字段，均可通过根目录 .env 设置
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs/config.yaml}
      MODE: ${MODE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedsystem}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/configs:/app/configs:ro
      - backend_uploads:/app/.run/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    restart: always
    environment:
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs/config.yaml}
      MODE: ${MODE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedsystem}
    volumes:
      - ./backend/configs:/app/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  sweeper:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: sweeper
    restart: always
    environment:
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs/config.yaml}
      MODE: ${MODE:-prod}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedsystem}
      RETENTION_USER_DELETED_DAYS: ${RETENTION_USER_DELETED_DAYS:-7}
      SWEEPER_INTERVAL_MINUTES: ${SWEEPER_INTERVAL_MINUTES:-60}
    volumes:
      - ./backend/configs:/app/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  backend_uploads:
