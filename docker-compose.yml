services:
  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - ./backend/.env
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 初始化业务数据库；IF NOT EXISTS 保证已有数据卷可重复启动
  init-db:
    image: mysql:8.0
    restart: "no"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mysql -h mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "CREATE DATABASE IF NOT EXISTS \`$${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"

  # 版本化迁移：由 golang-migrate 执行 backend/db/migrations 下的迁移文件
  # 依赖数据库初始化完成；迁移服务跑完退出后，backend/worker/sweeper 才会启动
  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    env_file:
      - ./backend/.env
    depends_on:
      init-db:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    entrypoint: ["/bin/sh", "-ec"]
    command: ["migrate -path /migrations -database \"mysql://root:$${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/$${MYSQL_DATABASE}?multiStatements=true\" up"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: always
    env_file:
      - ./backend/.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MODE: prod
      MYSQL_HOST: mysql
    ports:
      - "8080:8080"
    volumes:
      - ./backend/configs:/app/configs:ro
      - backend_uploads:/app/.run/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MODE: prod
      MYSQL_HOST: mysql
    volumes:
      - ./backend/configs:/app/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  sweeper:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: sweeper
    restart: always
    env_file:
      - ./backend/.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MODE: prod
      MYSQL_HOST: mysql
    volumes:
      - ./backend/configs:/app/configs:ro
      - backend_uploads:/app/.run/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  backend_uploads:
