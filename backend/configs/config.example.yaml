# ===================== GoFeed 配置模板 =====================
# 本文件是仓库中唯一入库的配置模板（configs/ 下其余 yaml 均为本地复制品，不入库）。
#
# 本地开发：
#   复制为 configs/config.dev.yaml，修改 database 中标注【本地需修改】的字段；
#   也可以不改文件，直接用 backend/.env 的 MYSQL_* 环境变量覆盖（环境变量优先）。
#
# Docker 部署：
#   复制为 configs/config.yaml 并修改：database.host 改为 mysql、
#   database.password 改为你的 MySQL 密码（与项目根目录 .env 的
#   MYSQL_ROOT_PASSWORD 保持一致）。
#   compose 会把宿主机 backend/configs 目录挂载到容器 /app/configs，
#   并设置 CONFIG_PATH=/app/configs/config.yaml，因此容器实际读取的是这份副本；
#   根目录 .env 中的 MODE / SERVER_PORT / MYSQL_* / JWT_SECRET 可覆盖对应字段（环境变量优先）。
# ================================================================

server:
  port: 8080          # HTTP 端口；本地可用 SERVER_PORT 覆盖；docker 下修改此值并同步 compose 端口映射

database:
  host: localhost     # 本地开发：本机 MySQL；docker：复制后改为 mysql（compose 网络内主机名）
  port: 3306          # 本地开发：本机 MySQL 端口；docker：容器内 3306
  user: root          # 本地开发：本机 MySQL 账号；docker：默认 root
  password: 123456    # 【本地需修改】你的 MySQL 密码；docker：与 .env 的 MYSQL_ROOT_PASSWORD 保持一致
  dbname: feedsystem  # 本地开发：需先手动建库；docker：与 .env 的 MYSQL_DATABASE 保持一致

redis:
  host: localhost
  port: 6379
  password: 123456
  db: 0

rabbitmq:
  host: localhost
  port: 5672
  username: admin
  password: password123

observe:
  pprof:
    enabled: true
    api_addr: localhost:6060
    worker_addr: localhost:6061
