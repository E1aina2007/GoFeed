# ===================== GoFeed 配置模板 =====================
# 本文件是仓库的配置模板
# 本地开发：
#   复制为 configs/config.dev.yaml，修改非敏感字段；
#   数据库密码、运行模式和 JWT 密钥必须写在 backend/.env 中
#
# Docker 部署：
#   复制为 configs/config.yaml 并修改 database.host 为 mysql；
#   数据库密码由 backend/.env 中的 MYSQL_ROOT_PASSWORD 注入。
#   compose 会把宿主机 backend/configs 目录挂载到容器 /app/configs，
#   并设置 CONFIG_PATH=/app/configs/config.yaml，因此容器实际读取的是这份副本；
#   Compose 会注入 MODE / MYSQL_HOST / CONFIG_PATH；仅 MODE=prod 启用生产模式，
#   其余 MODE 值均按 dev 处理；其他运行参数和密钥
#   由 backend/.env 提供（环境变量优先）
# ================================================================

server:
  port: 8080          # HTTP 端口；可用 SERVER_PORT 覆盖

database:
  host: localhost     # docker：复制后改为 mysql，或用 MYSQL_HOST 覆盖
  port: 3306          # 可用 MYSQL_PORT 覆盖
  user: root          # 可用 MYSQL_USER 覆盖
  dbname: feedsystem  # 可用 MYSQL_DATABASE 覆盖

retention:
  user_deleted_days: 7    # 注销账号软删除后的保留天数；可用 RETENTION_USER_DELETED_DAYS 覆盖
  video_deleted_days: 7   # 视频软删除后的保留天数；到期后 sweeper 清除媒体和记录，可用 RETENTION_VIDEO_DELETED_DAYS 覆盖
  video_draft_hours: 24   # 未完成草稿的保留小时数；可用 RETENTION_VIDEO_DRAFT_HOURS 覆盖

sweeper:
  interval_minutes: 60          # 用户、已发布视频和草稿清扫间隔（分钟）；可用 SWEEPER_INTERVAL_MINUTES 覆盖
  draft_purge_lease_minutes: 15 # 单条草稿清扫租约；可用 SWEEPER_DRAFT_PURGE_LEASE_MINUTES 覆盖

redis:
  host: localhost
  port: 6379
  db: 0

rabbitmq:
  host: localhost
  port: 5672
  username: admin

observe:
  pprof:
    enabled: true
    api_addr: localhost:6060
    worker_addr: localhost:6061
